# Shared proxy settings. Install as /etc/nginx/snippets/api-proxy.conf.
proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwrite (never append) so clients cannot spoof their address; Spring trusts these headers
# because nginx is the only thing that can reach it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
