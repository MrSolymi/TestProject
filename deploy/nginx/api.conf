# API reverse proxy for the VPS. Put this in /etc/nginx/conf.d/ (http context).
# Works with the nginx 1.24 that ships with Ubuntu 24.04.
#
# Traffic path: browser -> Cloudflare (proxied api.example.com) -> this server :443 -> Spring on 127.0.0.1:8080
#
# Layers of protection:
#   1. Firewall: 443 only from Cloudflare IP ranges (see DEPLOY.md, deploy/cloudflare-ips.sh).
#   2. Authenticated Origin Pulls (mTLS): nginx rejects any client that does not present the
#      Cloudflare client certificate, so direct hits to the origin IP fail the handshake.
#   3. Spring itself only listens on loopback.

limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.example.com;

    # Cloudflare Origin CA certificate for api.example.com (SSL mode: Full (strict)).
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Authenticated Origin Pulls: the CA that signed the client cert Cloudflare presents.
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;

    # Real client IP, trusted only from Cloudflare ranges (generated by deploy/cloudflare-ips.sh nginx).
    include /etc/nginx/cloudflare-realip.conf;
    real_ip_header CF-Connecting-IP;

    # Login and register are the brute-force targets.
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location / {
        return 404;
    }
}
