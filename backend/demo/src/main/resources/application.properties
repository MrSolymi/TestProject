spring.application.name=demo

# Only nginx on the same host should reach the app.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No default: startup fails fast if it is missing (use the dev profile locally).
# Must be at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=12h

app.invite.ttl=7d

app.cookie.name=session
app.cookie.secure=${COOKIE_SECURE:true}

# Origin of the SPA, e.g. https://app.example.com
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

# Seeds the first user when the users table is empty.
app.bootstrap.username=${APP_BOOTSTRAP_USERNAME:}
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:}
