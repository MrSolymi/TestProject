name: Backend

# On every change to the backend: run the tests. On `main`, also build the Docker image and publish it
# to GitHub's container registry, where the VPS pulls it from (see DEPLOY.md).
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  # Only pull request runs may be cancelled by a newer one. A run on main must never be cancelled
  # halfway, because it might be in the middle of updating the server.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # `sh gradlew` because the executable flag can be lost when files are committed from Windows.
      # The tests start a real Postgres with Testcontainers; Docker is preinstalled on the runner.
      - run: sh gradlew test --no-daemon

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lets the built-in token publish to ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Registry image names must be lowercase.
          images: ghcr.io/mrsolymi/testproject-backend
          # Two tags per build: `latest`, and `sha-<first 7 characters of the commit>` for rollbacks.
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: backend/demo
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 is what almost every VPS uses. For an ARM server use: linux/amd64,linux/arm64
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tells the VPS to start using the image that was just published. It logs in over SSH with a key that can
  # only run /usr/local/sbin/deploy-backend (set up in DEPLOY.md, step 14.2). Until the three DEPLOY_*
  # secrets exist this job does nothing, so pushing before the server is ready is fine.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: cfg
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "The DEPLOY_* secrets are not set, so the server is not updated automatically."
          fi
      - if: steps.cfg.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the server's identity so nobody can pose as it.
          printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          # The key on the server is restricted: whatever command we send, it only runs deploy-backend.
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 "deploy@$DEPLOY_HOST"
